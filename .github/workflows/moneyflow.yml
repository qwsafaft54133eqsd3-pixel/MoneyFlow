name: MoneyFlow
description: تطبيق إدارة المصروفات والدخل الشخصي
version: 1.0.0

platform: android

app:
  name: MoneyFlow
  package: com.moneyflow.app
  orientation: portrait
  language: ar
  theme: light
  primaryColor: "#4F46E5"

web:
  source: MoneyFlow_Arabic_Upgraded.html
  viewport:
    width: device-width
    initial-scale: 1.0
    user_scalable: false

storage:
  type: local
  key: moneyflow_v2

features:
  - income
  - expenses
  - budgets
  - transactions
  - spending_chart
  - categories
  - cash
  - card
  - wallet
  - local_storage

categories:
  - أكل
  - مواصلات
  - شراء
  - فواتير
  - ترفيه
  - تعليم
  - صحة
  - أخرى

android:
  minSdk: 23
  targetSdk: 35
  versionCode: 1
  versionName: "1.0.0"

permissions:
  - INTERNET

branding:
  appName: MoneyFlow
  designer: أحمد أيمن
